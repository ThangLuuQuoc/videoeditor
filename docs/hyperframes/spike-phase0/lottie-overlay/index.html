<!doctype html>
<html lang="vi" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/lottie.min.js"></script>
    <script src="assets/burst-anim.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0b1020; }
      #root { position: relative; width: 100%; height: 100%; font-family: "Segoe UI", Arial, sans-serif; }
      #bg {
        position: absolute; inset: 0; z-index: 0;
        background: radial-gradient(circle at 50% 35%, #27306b 0%, #0b1020 70%);
      }
      #title {
        position: absolute; left: 0; right: 0; top: 260px; z-index: 5;
        text-align: center; color: #fff; font-size: 96px; font-weight: 800; letter-spacing: -0.02em;
      }
      .burst { position: absolute; inset: auto; width: 512px; height: 512px; z-index: 3; }
      #burst-1 { left: 284px; top: 700px; }
      #burst-2 { left: 40px;  top: 1150px; }
      #burst-3 { left: 528px; top: 1300px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10"
         data-width="1080" data-height="1920" data-fps="30">
      <div id="bg" class="clip" data-start="0" data-duration="10" data-track-index="0"></div>
      <h1 id="title" class="clip" data-start="0" data-duration="10" data-track-index="1">Lottie × 3</h1>

      <!-- Each Lottie instance is an inline sub-composition: the runtime seeks Lottie relative to
           the closest [data-composition-id], so a plain clip would play from root time 0. -->
      <div id="burst-1" class="clip burst" data-composition-id="burst-1" data-start="1" data-duration="3"
           data-width="512" data-height="512" data-track-index="2"></div>
      <div id="burst-2" class="clip burst" data-composition-id="burst-2" data-start="3.5" data-duration="3"
           data-width="512" data-height="512" data-track-index="3"></div>
      <div id="burst-3" class="clip burst" data-composition-id="burst-3" data-start="6" data-duration="3"
           data-width="512" data-height="512" data-track-index="4"></div>
    </div>
    <script>
      // Lottie instances are created paused; the HyperFrames runtime discovers them via
      // lottie.getRegisteredAnimations() and seeks each one relative to its sub-composition.
      window.__timelines = window.__timelines || {};
      for (const id of ["burst-1", "burst-2", "burst-3"]) {
        const sub = gsap.timeline({ paused: true });
        sub.set({}, {}, 3);
        window.__timelines[id] = sub;
        lottie.loadAnimation({
          container: document.getElementById(id),
          renderer: "svg",
          loop: false,
          autoplay: false,
          animationData: window.BURST_ANIM,
          name: id,
        });
      }

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0);
      tl.to("#title", { opacity: 0, duration: 0.5 }, 9.3);
      tl.set({}, {}, 10);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
